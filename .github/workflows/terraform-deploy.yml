name: Deploy Infrastructure and Alexa Skill

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      LAMBDA_ARN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Lambda dependencies
        run: |
          npm ci --production
          cp -r node_modules lambda/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Import S3 state infrastructure (one-time)
        working-directory: terraform
        run: |
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_s3_bucket.terraform_state alexa-chatbot-terraform-state-981374387644 || echo "Already imported"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_dynamodb_table.terraform_lock alexa-chatbot-terraform-lock || echo "Already imported"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_s3_bucket_versioning.terraform_state alexa-chatbot-terraform-state-981374387644 || echo "Already imported"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_s3_bucket_server_side_encryption_configuration.terraform_state alexa-chatbot-terraform-state-981374387644 || echo "Already imported"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_s3_bucket_public_access_block.terraform_state alexa-chatbot-terraform-state-981374387644 || echo "Already imported"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="openai_model=${{ secrets.OPENAI_MODEL || 'gpt-3.5-turbo' }}" \
            -var="max_tokens=${{ secrets.MAX_TOKENS || 150 }}" \
            -var="temperature=${{ secrets.TEMPERATURE || 0.7 }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Lambda ARN
        working-directory: terraform
        run: |
          LAMBDA_ARN=$(terraform output -raw lambda_function_arn)
          echo "LAMBDA_ARN=$LAMBDA_ARN" >> $GITHUB_ENV
          echo "Lambda Function ARN: $LAMBDA_ARN"

      # Deploy Alexa Skill with ASK CLI (only if secrets are configured)
      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Configure ASK CLI
        run: |
          mkdir -p ~/.ask
          cat > ~/.ask/cli_config << EOF
          {
            "profiles": {
              "default": {
                "aws_profile": "ask_cli_default",
                "token": {
                  "access_token": "${{ secrets.ASK_ACCESS_TOKEN }}",
                  "refresh_token": "${{ secrets.ASK_REFRESH_TOKEN }}",
                  "token_type": "bearer",
                  "expires_in": 3600,
                  "expires_at": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
                },
                "vendor_id": "${{ secrets.ASK_VENDOR_ID }}"
              }
            }
          }
          EOF

      - name: Update Skill Manifest with Lambda ARN
        run: |
          jq --arg arn "$LAMBDA_ARN" '.manifest.apis.custom.endpoint.uri = $arn' \
            skill-package/skill.json > skill-package/skill.json.tmp
          mv skill-package/skill.json.tmp skill-package/skill.json

      - name: Configure ASK Skill ID
        run: |
          mkdir -p .ask
          # Update ask-states.json with the skill ID if it exists
          jq --arg skillId "${{ secrets.ASK_SKILL_ID }}" \
            '.profiles.default.skillId = $skillId' \
            .ask/ask-states.json > .ask/ask-states.json.tmp
          mv .ask/ask-states.json.tmp .ask/ask-states.json

      - name: Deploy Alexa Skill
        run: |
          echo "Deploying Alexa skill..."
          ask deploy --ignore-hash

      - name: Get Skill Status
        run: ask api get-skill-status --skill-id ${{ secrets.ASK_SKILL_ID }} || echo "Skill status check skipped"
