name: Deploy Infrastructure and Alexa Skill

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      LAMBDA_ARN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # Import existing Lambda resources (bootstrap only - remove after remote state is enabled)
      - name: Import existing Lambda resources
        working-directory: terraform
        run: |
          echo "Importing existing Lambda resources if they exist..."
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_iam_role.lambda_execution_role alexa-chatbot-conversation-execution-role || echo "IAM role already imported or doesn't exist"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_iam_role_policy_attachment.lambda_basic_execution alexa-chatbot-conversation-execution-role/arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || echo "Policy attachment already imported or doesn't exist"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_lambda_function.alexa_chatbot alexa-chatbot-conversation || echo "Lambda function already imported or doesn't exist"
          terraform import -var="aws_region=${{ secrets.AWS_REGION }}" -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" aws_lambda_permission.alexa_skill_trigger alexa-chatbot-conversation/AllowExecutionFromAlexa || echo "Lambda permission already imported or doesn't exist"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="openai_model=${{ secrets.OPENAI_MODEL || 'gpt-3.5-turbo' }}" \
            -var="max_tokens=${{ secrets.MAX_TOKENS || 150 }}" \
            -var="temperature=${{ secrets.TEMPERATURE || 0.7 }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Capture Lambda ARN
        working-directory: terraform
        run: |
          LAMBDA_ARN=$(terraform output -raw lambda_function_arn)
          echo "LAMBDA_ARN=$LAMBDA_ARN" >> $GITHUB_ENV
          echo "Lambda Function ARN: $LAMBDA_ARN"

      # Deploy Alexa Skill with ASK CLI (only if secrets are configured)
      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Configure ASK CLI
        run: |
          mkdir -p ~/.ask
          cat > ~/.ask/cli_config << EOF
          {
            "profiles": {
              "default": {
                "aws_profile": "ask_cli_default",
                "token": {
                  "access_token": "${{ secrets.ASK_ACCESS_TOKEN }}",
                  "refresh_token": "${{ secrets.ASK_REFRESH_TOKEN }}",
                  "token_type": "bearer",
                  "expires_in": 3600,
                  "expires_at": "$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%S.000Z)"
                },
                "vendor_id": "${{ secrets.ASK_VENDOR_ID }}"
              }
            }
          }
          EOF

      - name: Update Skill Manifest with Lambda ARN
        run: |
          jq --arg arn "$LAMBDA_ARN" '.manifest.apis.custom.endpoint.uri = $arn' \
            skill-package/skill.json > skill-package/skill.json.tmp
          mv skill-package/skill.json.tmp skill-package/skill.json

      - name: Deploy Alexa Skill
        run: |
          if [ -z "${{ secrets.ASK_SKILL_ID }}" ]; then
            echo "Creating new skill..."
            ask deploy --ignore-hash
          else
            echo "Updating existing skill..."
            ask deploy --skill-id ${{ secrets.ASK_SKILL_ID }} --ignore-hash
          fi

      - name: Get Skill Status
        run: ask api get-skill-status --skill-id ${{ secrets.ASK_SKILL_ID }} || echo "Skill status check skipped"
