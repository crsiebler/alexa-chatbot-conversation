name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r lambda/* deploy/
          cp -r node_modules deploy/
          cd deploy
          zip -r ../function.zip .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name alexa-chatbot-conversation \
            --zip-file fileb://function.zip
      
      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name alexa-chatbot-conversation \
            --environment "Variables={OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-3.5-turbo' }},MAX_TOKENS=${{ secrets.MAX_TOKENS || '150' }},TEMPERATURE=${{ secrets.TEMPERATURE || '0.7' }}}"
      
      - name: Publish new version
        run: |
          aws lambda publish-version \
            --function-name alexa-chatbot-conversation \
            --description "Deployed from GitHub Actions on $(date)"
